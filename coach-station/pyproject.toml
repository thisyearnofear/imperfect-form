[project]
name = "coach-station"
version = "0.1.0"
description = "Imperfect Form physical AI coach station - drives the SO-101 arm from live form events"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The Cyberwave SDK drives the SO-101 twin (simulation and live hardware).
# Install with: uv sync --extra cyberwave
cyberwave = ["cyberwave"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coach_station"]
