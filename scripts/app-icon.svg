<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" font-family="'Manrope','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0c3b3f"/>
      <stop offset="55%" stop-color="#081f22"/>
      <stop offset="100%" stop-color="#061013"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcb131"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- subtle ring -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="3"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#2dd4bf" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="6 12"/>

  <!-- Stylized figure: head + spine + arm with joint-angle correction arc -->
  <g transform="translate(512, 512)">
    <!-- head -->
    <circle cx="0" cy="-150" r="46" fill="#effcf9"/>
    <!-- spine -->
    <rect x="-16" y="-104" width="32" height="210" rx="16" fill="#effcf9"/>
    <!-- arm (upper + lower) -->
    <line x1="0" y1="-70" x2="112" y2="18" stroke="#effcf9" stroke-width="26" stroke-linecap="round"/>
    <line x1="112" y1="18" x2="162" y2="124" stroke="#effcf9" stroke-width="26" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="0" y1="106" x2="-72" y2="222" stroke="#effcf9" stroke-width="26" stroke-linecap="round"/>
    <line x1="0" y1="106" x2="72" y2="222" stroke="#effcf9" stroke-width="26" stroke-linecap="round"/>

    <!-- joint angle correction arc (gold) — the "coach shows the fix" mark -->
    <path d="M 150 8 A 44 44 0 0 1 112 62" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="112" cy="18" r="11" fill="url(#gold)"/>
  </g>

  <!-- Wordmark -->
  <text x="512" y="860" fill="#effcf9" font-size="64" font-weight="800" text-anchor="middle" letter-spacing="4">IMPERFECT</text>
  <text x="512" y="924" fill="url(#teal)" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="14">FORM</text>
</svg>
