<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Manrope','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="78%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#0c3b3f" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#081f22" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#061013" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tealLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcb131"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#061013"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle grid -->
  <g stroke="#2dd4bf" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>

  <!-- Top hairline -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#tealLine)"/>

  <!-- Wordmark / brand -->
  <text x="80" y="150" fill="#effcf9" font-size="30" font-weight="700" letter-spacing="6">IMPERFECT FORM</text>
  <rect x="80" y="168" width="64" height="3" fill="#fcb131"/>

  <!-- Headline -->
  <text x="78" y="270" fill="#effcf9" font-size="74" font-weight="800">Move with</text>
  <text x="78" y="352" fill="url(#goldText)" font-size="74" font-weight="800">better form.</text>

  <!-- Subhead -->
  <text x="80" y="412" fill="#9fb3b1" font-size="27" font-weight="500">Your camera understands your form.</text>
  <text x="80" y="448" fill="#9fb3b1" font-size="27" font-weight="500">A coach shows you how to fix it.</text>

  <!-- Trust line -->
  <g transform="translate(80, 510)">
    <circle cx="8" cy="8" r="5" fill="#2dd4bf"/>
    <text x="26" y="14" fill="#5eead4" font-size="22" font-weight="600">On-device pose · nothing uploads until you choose</text>
  </g>

  <!-- Right: stylized form-coach mark -->
  <g transform="translate(880, 315)">
    <!-- glow ring -->
    <circle cx="0" cy="0" r="190" fill="#2dd4bf" opacity="0.06" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 8"/>

    <!-- simplified figure: head + spine + arm angle markers -->
    <circle cx="0" cy="-92" r="26" fill="#effcf9"/>
    <rect x="-9" y="-66" width="18" height="120" rx="9" fill="#effcf9"/>
    <!-- arm with joint angle arc -->
    <line x1="0" y1="-40" x2="64" y2="10" stroke="#effcf9" stroke-width="14" stroke-linecap="round"/>
    <line x1="64" y1="10" x2="92" y2="70" stroke="#effcf9" stroke-width="14" stroke-linecap="round"/>
    <!-- leg -->
    <line x1="0" y1="54" x2="-40" y2="120" stroke="#effcf9" stroke-width="14" stroke-linecap="round"/>
    <line x1="0" y1="54" x2="40" y2="120" stroke="#effcf9" stroke-width="14" stroke-linecap="round"/>

    <!-- joint angle correction arc (gold) -->
    <path d="M 86 4 A 30 30 0 0 1 64 40" fill="none" stroke="#fcb131" stroke-width="4" stroke-linecap="round"/>
    <circle cx="64" cy="10" r="6" fill="#fcb131"/>
  </g>

  <!-- Bottom hairline + url -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#tealLine)"/>
  <text x="80" y="600" fill="#5eead4" font-size="22" font-weight="600" letter-spacing="1">imperfectform.fun</text>
  <text x="1120" y="600" fill="#5eead4" font-size="22" font-weight="600" letter-spacing="1" text-anchor="end">Private camera coaching</text>
</svg>
